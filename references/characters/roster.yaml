# 标准角色花名册 — 跨视频复用,建立品牌 IP
# 设计意图:
#   1. 同一角色跨多个视频出场,观众建立"众能联合的老周/王工"人格记忆
#   2. 角色 look 作为首镜文本身份锚点，后续真人镜头复用已验收视频
#   3. look + 原生声线 + catchphrases 三件套固化,IP 完整
#
# 给 LLM 看:写 storyboard 时,如果片子题材匹配 typical_scenarios,
# 强烈推荐用花名册里的角色 id(填入 characters[].id 字段),
# 让管线建立跨镜人物与原生声线连续性。
# 不匹配的题材也可现编(用全新 id),管线兼容。
#
# id 命名规则: {role_type}_{name_pinyin}

# ============================================================
# 主力 IP(本品牌的"门面")
# ============================================================

sales_xiaoneng:
  name: 小玲
  gender: female
  identity_type: real_person
  seedance_asset_uri:
  reference_image: "references/characters/sales_xiaoneng/canonical-v1.png"
  look: "28 岁中国女性设备租赁顾问。身份固定特征：偏长椭圆脸、下颌柔和收窄；黑棕色中长发，中分略偏侧分，发丝顺直、发尾带轻微自然弧度；细长自然眉；深色杏仁眼；纤细直鼻；自然饱满且唇峰清晰的唇形；肤色自然通透并保留真实皮肤纹理。神态亲和灵动，进入专业表达时目光笃定、反应利落。标准职业造型固定为炭灰色合身西装外套 + 暖白色圆领上衣，清透职业淡妆，无安全帽、无首饰、无工牌、无品牌标识。必须保持 reference_image 中的同一张脸和五官比例，绝非泛化网红脸、夸张大眼、尖下巴或强磨皮。"
  typical_scenarios: [设备租赁顾问, 效率型销售, 真人口播, 产品讲解, 客户经营, 行业短视频]
  catchphrases:
    - "狗不干？我干。"
    - "现在做租赁，拼的不是腿，是信息和效率。"
    - "把时间留给真正的客户。"
  brand_role: "众能设备租赁顾问 IP — 亲和、有行业感、能把复杂业务讲明白的固定真人角色"

boss_laozhou:
  name: 老周
  gender: male
  look: "48 岁北方亚洲男性。**深色板寸(头顶 3cm,两鬓微白)**,**国字脸宽下颌**,**卧蚕明显的小眼睛带笑纹**,鼻翼宽厚,嘴唇偏厚常抿成一条线。**常年户外的小麦色粗糙肤色**,左眉有道浅疤,手指粗大有老茧。**深灰夹克工装+磨白领口的藏青 polo**,袖口卷到小臂。**面相工地摸爬滚打二十年的包工头/老实人吃过亏型,绝非油滑老板/西装精英/书生型**。不戴眼镜"
  typical_scenarios: [工地老板视角, 揭坑反转, 苦笑过来人, 告诫新人, 算账时刻]
  catchphrases:
    - "哎我跟你讲"
    - "你猜后来咋着"
    - "这账谁算得清"
    - "我多掏了整整 X 万"
    - "记住喽"
  brand_role: "众能联合的核心 IP — '吃过亏的过来人'人格,串联所有揭坑系列"

