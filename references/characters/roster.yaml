# ============================================================
# 给 s1 LLM 的强约束
# ============================================================
# 写 storyboard.characters 时:
# 1. 优先匹配花名册 typical_scenarios → 直接用对应 id(boss_laozhou / engineer_wanggong / ...)
# 2. 用 id 时,characters 字段里的 look/name 必须**完全照搬花名册**(不要现编)
# 3. 题材完全不匹配花名册的(如儿童教育/医美等)才用全新 id 自由编
# 4. voiceover 里如果适合用某角色的 catchphrases,优先嵌入(建立人格记忆)
