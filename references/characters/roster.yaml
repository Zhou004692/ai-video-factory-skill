# 标准角色花名册 — 跨视频复用,建立品牌 IP
# 设计意图:
#   1. 同一角色跨多个视频出场,观众建立"众能联合的老周/王工"人格记忆
#   2. portrait 复用(s2 缓存),省 ¥0.3/job
#   3. voice + look + catchphrases 三件套固化,IP 完整
#
# 给 LLM 看:写 storyboard 时,如果片子题材匹配 typical_scenarios,
# 强烈推荐用花名册里的角色 id(填入 characters[].id 字段),
# 让管线复用缓存 portrait + 建立跨片人格连续性。
# 不匹配的题材也可现编(用全新 id),管线兼容。
#
# id 命名规则: {role_type}_{name_pinyin}

# ============================================================
# 主力 IP(本品牌的"门面")
# ============================================================

boss_laozhou:
  name: 老周
  gender: male
  voice_id: zh_male_dayi_uranus_bigtts
  voice_note: "大壹 — 朴实接地气,工地老板感"
  look: "48 岁北方亚洲男性。**深色板寸(头顶 3cm,两鬓微白)**,**国字脸宽下颌**,**卧蚕明显的小眼睛带笑纹**,鼻翼宽厚,嘴唇偏厚常抿成一条线。**常年户外的小麦色粗糙肤色**,左眉有道浅疤,手指粗大有老茧。**深灰夹克工装+磨白领口的藏青 polo**,袖口卷到小臂。**面相工地摸爬滚打二十年的包工头/老实人吃过亏型,绝非油滑老板/西装精英/书生型**。不戴眼镜"
  typical_scenarios: [工地老板视角, 揭坑反转, 苦笑过来人, 告诫新人, 算账时刻]
  catchphrases:
    - "哎我跟你讲"
    - "你猜后来咋着"
    - "这账谁算得清"
    - "我多掏了整整 X 万"
    - "记住喽"
  brand_role: "众能联合的核心 IP — '吃过亏的过来人'人格,串联所有揭坑系列"

# ============================================================
# 高频配角(常驻角色)
# ============================================================

engineer_wanggong:
  name: 王工
  gender: female
  voice_id: zh_female_kefunvsheng_uranus_bigtts
  voice_note: "暖阳女声 — 温暖专业,服务/对话戏推荐"
  look: "32 岁北方亚洲女性。**棕色直发盘成低马尾**,**瓜子脸 + 凤眼细长单眼皮**,鼻梁挺直,**薄唇微抿嘴角下压**。**冷调白皙皮肤**偏冷感,素颜无浓妆。**黑色技术夹克 + 白衬衫**,手里常拿深蓝色检测板或卡尺。**面相清冷干练 / 设备工程师 / 北方理工女,绝非邻家女孩 / 娃娃脸 / 双眼皮甜美型**。不戴眼镜"
  typical_scenarios: [设备验车, 专业拆穿, 冷静揭秘, 数据派, 技术派对话戏]
  catchphrases:
    - "我去年验过这台车"
    - "这接头是焊过的,原厂没这种焊点"
    - "出厂铭牌被磨过"
    - "数据不会撒谎"
  brand_role: "技术权威 IP — 数据/专业角度反转,跟老周配对的'内行揭秘者'"

expert_laofashi:
  name: 老法师
  gender: male
  voice_id: zh_male_cixingjieshuonan_uranus_bigtts
  voice_note: "磁性解说男声 — 低沉纪录片感,行业揭秘"
  look: "52 岁南方亚洲男性。**花白寸头利落**,**长方脸颧骨高**,**细长眼带审视感、眼角下垂**,鼻梁直,薄唇。**冷白偏灰的室内肤色**,法令纹深。**深咖色针织开衫 + 熨帖白衬衫**,袖口有金属袖扣。**面相阅尽行业套路的老法师 / 精明不外露的内行,绝非市井大叔 / 憨厚老农 / 江湖骗子型**。半框金丝眼镜挂鼻尖,说话时从镜片上方看人"
  typical_scenarios: [行业内幕揭秘, 老炮点评, 一句话戳穿, 高冷点拨, "信息差"主题]
  catchphrases:
    - "实话告诉你"
    - "这行里最值钱的不是设备,是合同"
    - "你签的那天就输了"
    - "定义权在谁手上,钱就在谁兜里"
  brand_role: "行业洞察 IP — 高冷揭秘,跟老周的'吃亏'形成'师徒'反差"

# ============================================================
# 反派/配角(灵活上场)
# ============================================================

sales_xiaomei:
  name: 客服小美
  gender: female
  voice_id: zh_female_linjianvhai_uranus_bigtts
  voice_note: "邻家女孩 — 亲切对话戏推荐"
  look: "26 岁南方亚洲女性。**齐肩黑直发发尾微卷**,**圆脸 + 双眼皮大眼**,鼻头圆润,嘴角自然上扬。**白皙偏暖肤色**,职业淡妆。**浅灰色职业套装 + 白衬衫**,胸前挂工牌。**面相南方水灵型 / 邻家妹妹 / 职场新人型,绝非凤眼薄唇 / 高级杂志脸 / 御姐型**。不戴眼镜"
  typical_scenarios: [租赁公司客服/销售视角, 隐晦得意, 职业化忽悠, 反派客气]
  catchphrases:
    - "您看这合同里写得很清楚"
    - "我们公司的标准就是这样"
    - "其他客户也都是这么签的"
  brand_role: "反派代表 IP — 把租赁方'话术套路'具象化"

rookie_xiaobai:
  name: 小白
  gender: male
  voice_id: zh_male_linjiananhai_uranus_bigtts
  voice_note: "邻家男孩 — 年轻新手对话戏"
  look: "25 岁亚洲男性。**黑色短发自然平头**,**圆脸 + 双眼皮大眼**,鼻头圆润,常带憨厚笑容。**偏暖小麦色肤色**(刚下工地晒过)。**亮黄色安全帽 + 工装马甲**,工牌挂胸前。**面相新人/学徒/年轻工程人型,绝非老练老板 / 油滑销售 / 技术宅型**。不戴眼镜"
  typical_scenarios: [新手被坑视角, 自嘲式反转, 师父教徒弟, 第一天上工]
  catchphrases:
    - "我以为..."
    - "周哥/王姐,这个咋办"
    - "啊?我不知道啊"
    - "原来是这样"
  brand_role: "新手 IP — 教育/科普类内容的提问者,'代你问'的角色"

# ============================================================
# Narrator(全片旁白,通常不出镜)
# ============================================================

narrator_morgan:
  name: 旁白·Morgan
  gender: male
  voice_id: zh_male_cixingjieshuonan_uranus_bigtts  # 跟老法师同音色(可选用磁性解说)
  voice_note: "磁性解说 — 纪录片风/反转铺垫"
  typical_scenarios: [破题旁白, 数据陈述, 结尾点题, broll 配音]
  brand_role: "旁白 IP — 用纪录片感拉高'内行揭秘'的可信度"

# ============================================================
# 给 s1 LLM 的强约束
# ============================================================
# 写 storyboard.characters 时:
# 1. 优先匹配花名册 typical_scenarios → 直接用对应 id(boss_laozhou / engineer_wanggong / ...)
# 2. 用 id 时,characters 字段里的 look/voice_id/name 必须**完全照搬花名册**(不要现编)
# 3. 题材完全不匹配花名册的(如儿童教育/医美等)才用全新 id 自由编
# 4. voiceover 里如果适合用某角色的 catchphrases,优先嵌入(建立人格记忆)
